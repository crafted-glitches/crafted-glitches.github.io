<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 — SIGNAL LOST // CRAFTED GLITCHES</title>
<link rel="icon" type="image/png" href="/assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#000;color:#f2f2f2;
    font-family:"Space Mono",ui-monospace,Menlo,monospace;overflow:hidden}
  .wrap{height:100%;display:grid;place-content:center;text-align:center;gap:1.4rem;padding:2rem}
  .code{font-family:"Chakra Petch",sans-serif;font-weight:600;
    font-size:clamp(5rem,26vw,18rem);line-height:.8;letter-spacing:.05em;position:relative}
  .code::before,.code::after{content:"404";position:absolute;inset:0;opacity:.85;mix-blend-mode:screen}
  .code::before{color:#00e5ff;animation:a .35s steps(1) infinite}
  .code::after{color:#ff0055;animation:b .35s steps(1) infinite}
  @keyframes a{0%,100%{transform:translate(0,0);clip-path:inset(0)}
    50%{transform:translate(-4px,2px);clip-path:inset(20% 0 55% 0)}}
  @keyframes b{0%,100%{transform:translate(0,0);clip-path:inset(0)}
    50%{transform:translate(4px,-2px);clip-path:inset(60% 0 15% 0)}}
  .msg{font-size:.7rem;letter-spacing:.5em;text-transform:uppercase;color:#6a6a6a}
  a{color:#f2f2f2;text-decoration:none;border-bottom:1px solid #6a6a6a;
    font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;padding-bottom:.2em}
  a:hover{border-color:#00e5ff}
  .fx{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.5}
</style>
</head>
<body>
  <div class="fx"></div>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">Signal Lost // Coordinate Not Found</div>
    <a href="/">Return To Origin</a>
  </div>
</body>
</html>
