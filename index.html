<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CRAFTED GLITCHES</title>
<meta name="description" content="Crafted Glitches — a little bit of everything (and anything)." />

<!-- Open Graph / social -->
<meta property="og:type" content="website" />
<meta property="og:title" content="CRAFTED GLITCHES" />
<meta property="og:description" content="A little bit of everything (and anything)." />
<meta property="og:image" content="assets/logo.png" />
<meta name="theme-color" content="#000000" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />

<!-- Type: geometric futuristic display + technical mono -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>

<body>
<!-- ── boot / cold-start overlay ───────────────────────────────── -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot__line" data-boot>ESTABLISHING LINK<span class="boot__dots"></span></div>
</div>
<script>/* failsafe: always clear the boot veil even if scripts fail to load */
setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('gone');},3200);</script>

<!-- ── live vortex (webgl) ─────────────────────────────────────── -->
<canvas id="gl" aria-hidden="true"></canvas>

<!-- static fallback when webgl is unavailable -->
<noscript>
  <img class="fallback" src="assets/logo.png" alt="Crafted Glitches" />
</noscript>
<img id="fallback" class="fallback" src="assets/logo.png" alt="Crafted Glitches" hidden />

<!-- ── grain / scanline / vignette overlays ────────────────────── -->
<div class="fx fx--focus" aria-hidden="true"></div>
<div class="fx fx--scan" aria-hidden="true"></div>
<div class="fx fx--grain" aria-hidden="true"></div>
<div class="fx fx--vignette" aria-hidden="true"></div>

<!-- ── content ─────────────────────────────────────────────────── -->
<main class="stage">

  <header class="top">
    <span class="top__id" data-scramble>CG//0x1</span>
    <span class="top__stat"><i class="pulse"></i>SIGNAL&nbsp;ACTIVE</span>
  </header>

  <section class="core">
    <h1 class="mark" data-glitch="CRAFTED GLITCHES">
      <span class="mark__l">CRAFTED</span>
      <span class="mark__l">GLITCHES</span>
    </h1>

    <p class="tagline" data-decode="A LITTLE BIT OF EVERYTHING (AND ANYTHING).">A LITTLE BIT OF EVERYTHING (AND ANYTHING).</p>
  </section>

  <!-- repos surfaced as circuit nodes, echoing the logo's tendrils -->
  <nav class="nodes" aria-label="Transmissions">
    <a class="node" href="https://github.com/crafted-glitches" target="_blank" rel="noopener">
      <span class="node__dot"></span>
      <span class="node__k" data-scramble>ORG</span>
      <span class="node__v">github.com/crafted-glitches</span>
    </a>
    <a class="node" href="https://github.com/crafted-glitches/particled" target="_blank" rel="noopener">
      <span class="node__dot"></span>
      <span class="node__k" data-scramble>PARTICLED</span>
      <span class="node__v">audio-reactive particle fields</span>
    </a>
    <a class="node" href="https://github.com/crafted-glitches/deploy-barometer" target="_blank" rel="noopener">
      <span class="node__dot"></span>
      <span class="node__k" data-scramble>DEPLOY-BAROMETER</span>
      <span class="node__v">should i deploy today? · on hardware</span>
    </a>
  </nav>

  <footer class="bottom">
    <span data-scramble>NULL&nbsp;SECTOR</span>
    <span class="bottom__coord" id="coord">00.0000&nbsp;/&nbsp;00.0000</span>
    <span data-scramble>EST.&nbsp;∞</span>
  </footer>

</main>

<!-- custom cursor -->
<div id="cursor" class="cursor" aria-hidden="true"></div>

<script src="js/vortex.js"></script>
<script src="js/glitch.js"></script>
</body>
</html>
